# 每天 HKT 08:10：文案 + 配图（Pollinations 免费出图，无需额外 API）
name: Shatin weather content

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INCLUDE_FIRST_POST_GREETING: "false"
      IMAGE_PROVIDER: pollinations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate all platform content
        run: python generate_posts.py

      - name: Generate weather images
        run: python generate_post_images.py

      - name: Commit state (首帖标记 & 去重 hash)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "chore: update post generation state [skip ci]"
          git push

      - name: Upload posts and images
        uses: actions/upload-artifact@v4
        with:
          name: shatin-content-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 30
